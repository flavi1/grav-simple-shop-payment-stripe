# user/plugins/simple-shop-payment-stripe/blueprints.yaml
name: Simple Shop Payment Stripe
version: 1.0.0
description: Passerelle de paiement Stripe pour Simple Shop.
icon: credit-card
author:
  name: Guillon Flavien
homepage: https://votre-site.com
keywords: grav, plugin, shop, payment, stripe
bugs: https://votre-site.com
license: MIT

dependencies:
  - name: simple-shop
  - name: mvc

form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: Statut du module
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool
    
    use_javascript:
      type: toggle
      label: Formulaire de paiement intégré (JavaScript)
      help: "Activé : formulaire Stripe Elements dans la page (le bouton de repli sans JavaScript reste proposé). Désactivé : aucun JavaScript, le client règle sur la page hébergée de Stripe puis revient sur le site."
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    stripe_mode:
      type: select
      label: Mode Stripe
      default: test
      options:
        test: Mode Test
        live: Mode Production
    
    test_secret_key:
      type: text
      label: Clé Secrète (Test)
      placeholder: sk_test_...
      
    test_publishable_key:
      type: text
      label: Clé Publique (Test)
      placeholder: pk_test_...

    live_secret_key:
      type: text
      label: Clé Secrète (Live)
      placeholder: sk_live_...

    live_publishable_key:
      type: text
      label: Clé Publique (Live)
      placeholder: pk_live_...

    webhook_secret:
      type: text
      label: Secret de signature du webhook
      help: "Commence par whsec_. Affiché dans Stripe, Développeurs > Webhooks, sur le point de terminaison créé pour ce site (voir README du plugin)."
      placeholder: whsec_...
